name: WOKO watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: woko-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check for new listings
        env:
          WOKO_SMTP_USER: ${{ secrets.WOKO_SMTP_USER }}
          WOKO_SMTP_PASS: ${{ secrets.WOKO_SMTP_PASS }}
          WOKO_EMAIL_TO:  ${{ secrets.WOKO_EMAIL_TO }}
        run: python woko_watch.py

      - name: Save state
        run: |
          git config user.name  "woko-watch bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen.json
          git diff --cached --quiet || git commit -m "Update seen listings [skip ci]"
          git push
